<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fossil Isle — 浮遊島の発掘現場</title>
<style>
  :root {
    --ink: #1d2b3a;
    --panel: rgba(255, 255, 255, 0.72);
    --panel-edge: rgba(255, 255, 255, 0.9);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #dff1fb;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #scene:active { cursor: grabbing; }

  .hud { position: fixed; pointer-events: none; user-select: none; }

  #title {
    top: 18px; left: 18px;
    padding: 12px 18px 13px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(30, 60, 90, 0.18);
  }
  #title h1 {
    margin: 0; font-size: 17px; letter-spacing: 0.04em; font-weight: 800;
  }
  #title p { margin: 4px 0 0; font-size: 11.5px; opacity: 0.68; letter-spacing: 0.02em; }

  #controls {
    left: 18px; bottom: 18px;
    padding: 11px 15px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(30, 60, 90, 0.18);
    font-size: 12px; line-height: 1.75;
  }
  #controls b {
    display: inline-block; min-width: 84px;
    font-weight: 700; color: #2f6fb5;
  }
  #controls span { opacity: 0.75; }

  #fps {
    top: 18px; right: 18px;
    padding: 7px 12px;
    background: rgba(20, 34, 48, 0.62);
    border-radius: 10px;
    color: #8ef0a4;
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.06em;
  }

  #loader {
    inset: 0; position: fixed; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    background: linear-gradient(180deg, #86c6f2 0%, #cfeaf9 62%, #eaf6ff 100%);
    transition: opacity 0.6s ease;
    z-index: 10;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader h2 {
    margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.08em;
    color: #23415c;
  }
  #loader-text { font-size: 12.5px; color: #35597a; letter-spacing: 0.05em; min-height: 18px; }
  #loader-track {
    width: 240px; height: 8px; border-radius: 99px;
    background: rgba(255, 255, 255, 0.55);
    overflow: hidden; box-shadow: inset 0 1px 3px rgba(20, 50, 80, 0.16);
  }
  #loader-bar {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #ffd15c, #6fd18c);
    transition: width 0.35s ease;
  }
  .cubes { display: flex; gap: 7px; }
  .cubes i {
    width: 13px; height: 13px; border-radius: 3px; display: block;
    background: #4f9edd; box-shadow: 0 2px 0 #37699a;
    animation: hop 1s ease-in-out infinite;
  }
  .cubes i:nth-child(2) { animation-delay: 0.12s; background: #6fd18c; box-shadow: 0 2px 0 #47906a; }
  .cubes i:nth-child(3) { animation-delay: 0.24s; background: #ffd15c; box-shadow: 0 2px 0 #c39a34; }
  .cubes i:nth-child(4) { animation-delay: 0.36s; background: #ee7f6d; box-shadow: 0 2px 0 #ad5847; }
  @keyframes hop {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-11px); }
  }

  @media (max-width: 720px) {
    #title h1 { font-size: 14px; }
    #title p, #controls { font-size: 10.5px; }
    #controls b { min-width: 68px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud" id="title">
  <h1>Fossil Isle&nbsp;&nbsp;—&nbsp;&nbsp;浮遊島の発掘現場</h1>
  <p>アイソメトリック・ボクセル / アニメ調シェーディング · Three.js</p>
</div>

<div class="hud" id="controls">
  <div><b>クリック</b><span>発掘家が歩く（カメラは遅れて追従）</span></div>
  <div><b>ドラッグ</b><span>カメラを回転・見下ろし角の変更</span></div>
  <div><b>ホイール</b><span>ズームイン / アウト（ピンチ対応）</span></div>
</div>

<div class="hud" id="fps">— fps</div>

<div id="loader">
  <div class="cubes"><i></i><i></i><i></i><i></i></div>
  <h2>FOSSIL ISLE</h2>
  <div id="loader-text">世界を組み立てています</div>
  <div id="loader-track"><div id="loader-bar"></div></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
